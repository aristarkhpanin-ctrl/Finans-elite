[project]
name = "calc-core"
version = "0.1.0"
description = "Расчётное ядро финансовой модели (SaaS, паритет с Project Expert 7.21)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "argon2-cffi>=23.0",
    "PyJWT>=2.8",
    "httpx>=0.27",
    "celery>=5.3",
    "redis>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]
prod = [
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["calc_core", "app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# Автогенерируемые миграции Alembic не подчиняем стилевым правилам.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",   # длинные строки — существующий стиль (числовые формулы движка)
    "E741",   # односимвольные B/I/P/C — доменные коды отчётов (методика расчёта)
    "B008",   # вызов в аргументе по умолчанию — идиома FastAPI Depends()
]

[tool.mypy]
python_version = "3.11"
files = ["calc_core"]
# Прагматичная база для точностного ядра: проверяем тела функций на реальные ошибки
# типов (None-индексация, float(None), неверные аннотации) без требования аннотировать
# каждый внутренний хелпер — полная типизация тупловых возвратов движка — отдельная задача.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
