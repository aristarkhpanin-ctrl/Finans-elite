# SPA (React) за nginx + прокси API на сервис `api` (см. docker-compose корня).
# Единый origin: браузер ходит только на этот сервер, CORS не нужен.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # gzip для текстовых ресурсов.
    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # Долгий кэш для хэшированных ассетов Vite (имя меняется при изменении содержимого).
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # API и health — на бэкенд (проксируем реальный IP клиента для rate-limit).
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /health {
        proxy_pass         http://api:8000/health;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # SPA-фолбэк: любой неизвестный путь отдаёт index.html (клиентский роутинг).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
