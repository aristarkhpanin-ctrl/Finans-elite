name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установка зависимостей
        run: pip install ".[dev]"

      - name: Линтер (ruff)
        run: ruff check .

      - name: Типы (mypy)
        run: python -m mypy

      - name: Контракт OpenAPI актуален
        run: |
          python scripts/dump_openapi.py
          git diff --exit-code openapi.json \
            || (echo '::error::openapi.json устарел — запустите: python scripts/dump_openapi.py' && exit 1)

      - name: Проверка миграций (SQLite)
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: |
          alembic upgrade head
          alembic downgrade base

      - name: Тесты
        run: pytest -q
