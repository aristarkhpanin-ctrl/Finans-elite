name: frontend-ci

on:
  push:
    paths:
      - "frontend/**"
      - "backend/openapi.json"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/openapi.json"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Типы API синхронны с контрактом
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts \
            || (echo '::error::schema.d.ts устарел — запустите: npm run gen:api' && exit 1)

      - name: Линтер (ESLint)
        run: npx eslint . --max-warnings 0

      - name: Проверка типов
        run: npm run typecheck

      - name: Тесты (Vitest)
        run: npm run test

      - name: Сборка
        run: npm run build

  # Сквозной дым: приложение целиком (браузер → фронт → бэкенд → база). Отдельной
  # работой, потому что нужен Python и браузер, а падение здесь означает другое:
  # не «сломана логика», а «сломан шов между слоями».
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Зависимости фронта
        run: npm ci

      - name: Зависимости бэкенда
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Браузер для Playwright
        run: npx playwright install --with-deps chromium

      - name: Сквозные тесты
        run: npm run e2e

      - name: Артефакты падения
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
