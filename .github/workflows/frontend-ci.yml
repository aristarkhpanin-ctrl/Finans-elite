name: frontend-ci

on:
  push:
    paths:
      - "frontend/**"
      - "backend/openapi.json"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/openapi.json"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Типы API синхронны с контрактом
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts \
            || (echo '::error::schema.d.ts устарел — запустите: npm run gen:api' && exit 1)

      - name: Проверка типов
        run: npm run typecheck

      - name: Сборка
        run: npm run build
