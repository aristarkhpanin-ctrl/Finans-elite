# Полный стек Finans-Elite: PostgreSQL + Redis + API (FastAPI) + worker (Celery) +
# beat (планировщик Celery) + web (nginx).
#
# Единая точка входа — web на :8080; API наружу не публикуется, доступен только
# через nginx-прокси (/api, /health), поэтому фронт и бэк живут на одном origin
# и CORS не требуется. Тяжёлый анализ (Монте-Карло) считает Celery-воркер через Redis.
# Для разработки только ядра есть backend/docker-compose.yml.
#
# Запуск всего одной командой (без предварительной настройки, режим разработки):
#
#   docker compose up --build      # http://localhost:8080
#
# Для продакшена задайте секреты (например, в .env рядом с этим файлом) и режим:
#   APP_ENV=production, JWT_SECRET=<случайный>, POSTGRES_PASSWORD=<...>
# В production бэкенд fail-fast требует настоящий JWT_SECRET (см. app/security.py).

# Общее окружение backend-процессов (api и worker — один образ).
# По умолчанию — режим разработки с безопасными для локального запуска заглушками;
# переопределяются переменными окружения / файлом .env.
x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  # Приложение подключается ролью без прав суперпользователя (L11): суперпользователь
  # обходит RLS всегда, и изоляция организаций в базе стояла бы на бумаге. Роль
  # заводит сервис db-setup; суперпользователь finans остаётся для обслуживания.
  DATABASE_URL: postgresql+psycopg://finans_app:${APP_DB_PASSWORD:-finans_app}@db:5432/finans
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
  JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-86400}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
  YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
  YOOKASSA_VAT_CODE: ${YOOKASSA_VAT_CODE:-1}
  YOOKASSA_API_BASE: ${YOOKASSA_API_BASE:-}
  # Решения владельца и эксплуатации (пакет K, K6; описание — backend/.env.example и
  # docs/OWNER-SETUP.md). Без этого перечня `.env` рядом с файлом подставлялся только в
  # сам compose, а в контейнеры не попадал: почта, реквизиты продавца, скидка за год и
  # сбор событий молча оставались выключенными. Пусто = не задано (app/env.py); полноту
  # перечня сверяет tests/test_compose_env.py.
  LOG_LEVEL: ${LOG_LEVEL:-}
  JWT_REMEMBER_TTL_SECONDS: ${JWT_REMEMBER_TTL_SECONDS:-}
  INVITE_TTL_SECONDS: ${INVITE_TTL_SECONDS:-}
  MUTE_TTL_SECONDS: ${MUTE_TTL_SECONDS:-}
  PWNED_CHECK: ${PWNED_CHECK:-}
  PWNED_TIMEOUT: ${PWNED_TIMEOUT:-}
  MAIL_BACKEND: ${MAIL_BACKEND:-off}
  PUBLIC_URL: ${PUBLIC_URL:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_TLS: ${SMTP_TLS:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_TIMEOUT: ${SMTP_TIMEOUT:-}
  MAIL_FROM: ${MAIL_FROM:-}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
  # Решение владельца (docs/OWNER-SETUP.md, «Принятые решения»): события собираются.
  USAGE_EVENTS: ${USAGE_EVENTS:-1}
  USAGE_SALT: ${USAGE_SALT:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  STUCK_JOB_ALERT_MINUTES: ${STUCK_JOB_ALERT_MINUTES:-}
  # Решение владельца: два месяца в подарок за оплату года (год — цена 10 месяцев).
  ANNUAL_FREE_MONTHS: ${ANNUAL_FREE_MONTHS:-2}
  GIRBO_ENABLED: ${GIRBO_ENABLED:-}
  GIRBO_BASE_URL: ${GIRBO_BASE_URL:-}
  SELLER_NAME: ${SELLER_NAME:-}
  SELLER_INN: ${SELLER_INN:-}
  SELLER_KPP: ${SELLER_KPP:-}
  SELLER_ADDRESS: ${SELLER_ADDRESS:-}
  SELLER_BANK: ${SELLER_BANK:-}
  SELLER_BIK: ${SELLER_BIK:-}
  SELLER_ACCOUNT: ${SELLER_ACCOUNT:-}
  SELLER_CORR_ACCOUNT: ${SELLER_CORR_ACCOUNT:-}
  SELLER_DIRECTOR: ${SELLER_DIRECTOR:-}
  SELLER_ACCOUNTANT: ${SELLER_ACCOUNTANT:-}
  SELLER_VAT_RATE: ${SELLER_VAT_RATE:-}
  SELLER_OGRN: ${SELLER_OGRN:-}
  SELLER_EMAIL: ${SELLER_EMAIL:-}
  SELLER_PHONE: ${SELLER_PHONE:-}
  LEGAL_DOCS_EDITION: ${LEGAL_DOCS_EDITION:-}
  # Резервные копии (L11): API читает отметки службы копирования для «Готовности».
  BACKUP_DIR: ${BACKUP_DIR:-/backups}
  RESTORE_CHECK_DAYS: ${RESTORE_CHECK_DAYS:-7}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finans
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finans}
      POSTGRES_DB: finans
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finans"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Роль приложения в базе (L11): идемпотентно при каждом старте — заводит finans_app,
  # если её нет, и передаёт ей владение базой и таблицами. Годится и для новой базы, и
  # для уже работающей; API, воркер и планировщик ждут его завершения.
  db-setup:
    image: postgres:16-alpine
    command: ["sh", "-c", "psql -q -v app_password=\"$$APP_DB_PASSWORD\" -f /ops/app-role.sql"]
    environment:
      PGHOST: db
      PGUSER: finans
      PGPASSWORD: ${POSTGRES_PASSWORD:-finans}
      PGDATABASE: finans
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-finans_app}
    volumes:
      - ./ops/db/app-role.sql:/ops/app-role.sql:ro
    depends_on:
      db:
        condition: service_healthy

  # Резервные копии (L11): pg_dump раз в сутки, хранение BACKUP_KEEP_DAYS дней, раз в
  # RESTORE_CHECK_DAYS дней — проверка восстановления в отдельной базе. Делается
  # суперпользователем: роль приложения под RLS видит только «свою» организацию, и копия
  # от её имени была бы пустой. Копии лежат в томе backups на этом же сервере — вынести
  # копию за его пределы (docs/HOSTING-CHECKLIST.md).
  backup:
    image: postgres:16-alpine
    command: ["sh", "/ops/backup/backup.sh", "loop"]
    environment:
      PGHOST: db
      PGUSER: finans
      PGPASSWORD: ${POSTGRES_PASSWORD:-finans}
      PGDATABASE: finans
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-1}
      RESTORE_CHECK_DAYS: ${RESTORE_CHECK_DAYS:-7}
    volumes:
      - backups:/backups
      - ./ops/backup:/ops/backup:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment: *backend-env
    volumes:
      - backups:/backups:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 25s        # запас на сборку/миграции перед первой проверкой
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Планировщик (пакет G, G3): ставит в очередь суточные задачи платформы — сверку
  # неоплаты, письма о деньгах, продление. Считает их тот же worker. Процесс beat должен
  # быть **ровно один**: два поставили бы каждую задачу дважды. Расписание — в
  # app/celery_app.py (beat_schedule), каждый запуск оставляет след в служебном журнале.
  beat:
    build: ./backend
    command: celery -A app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  backups:
