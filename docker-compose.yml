# Полный стек Finans-Elite: PostgreSQL + Redis + API (FastAPI) + worker (Celery) + web (nginx).
#
# Единая точка входа — web на :8080; API наружу не публикуется, доступен только
# через nginx-прокси (/api, /health), поэтому фронт и бэк живут на одном origin
# и CORS не требуется. Тяжёлый анализ (Монте-Карло) считает Celery-воркер через Redis.
# Для разработки только ядра есть backend/docker-compose.yml.
#
#   cp backend/.env.example .env   # заполнить JWT_SECRET и прочие секреты
#   docker compose up --build      # http://localhost:8080

# Общее окружение backend-процессов (api и worker — один образ).
x-backend-env: &backend-env
  APP_ENV: production
  DATABASE_URL: postgresql+psycopg://finans:${POSTGRES_PASSWORD:-finans}@db:5432/finans
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET обязателен (см. backend/.env.example)}
  JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-86400}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
  YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
  YOOKASSA_VAT_CODE: ${YOOKASSA_VAT_CODE:-1}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finans
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finans}
      POSTGRES_DB: finans
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finans"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
